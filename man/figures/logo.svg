<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="g" x1="96" y1="64" x2="416" y2="448" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#2DD4BF"/>
            <stop offset="1" stop-color="#3B82F6"/>
        </linearGradient>

        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0B1220" flood-opacity="0.25"/>
        </filter>
    </defs>

    <!-- Regular hexagon (equal side lengths) -->
    <polygon
            filter="url(#shadow)"
            points="256,56 432,156 432,356 256,456 80,356 80,156"
            fill="url(#g)"
    />

    <!-- Inner hex (same geometry, inset) -->
    <polygon
            points="256,96 392,176 392,336 256,416 120,336 120,176"
            fill="rgba(255,255,255,0.12)"
    />

    <!-- PR lettering (simple, bold, crisp) -->
    <g fill="#FFFFFF" transform="translate(0 2)">
        <!-- P -->
        <path d="M165 325V185h66c44 0 71 23 71 60 0 39-29 62-77 62h-19v18h-41zm41-58h22c21 0 33-9 33-25 0-15-11-24-32-24h-23v49z"/>
        <!-- R -->
        <path d="M315 325V185h70c43 0 68 20 68 54 0 25-14 43-38 51l37 35h-52l-28-28h-16v28h-41zm41-64h25c18 0 28-7 28-20 0-12-10-19-28-19h-25v39z"/>
    </g>

    <!-- Small input hint -->
    <g transform="translate(162 356)">
        <rect x="0" y="0" width="188" height="46" rx="14" ry="14" fill="rgba(255,255,255,0.20)"/>
        <!-- inner text area -->
        <rect x="16" y="14" width="116" height="18" rx="7" ry="7" fill="rgba(255,255,255,0.22)"/>
        <!-- caret -->
        <rect x="146" y="12" width="4" height="22" fill="#FFFFFF" opacity="0.9"/>
        <!-- small “submit” dot -->
        <circle cx="168" cy="23" r="5" fill="#FFFFFF" opacity="0.85"/>
    </g>
</svg>
